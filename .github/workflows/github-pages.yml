name: "Publish to GitHub Pages"
# Build the Web export and deploy it when main is updated.
on:
  push:
    branches:
      - main

# Cancel any ongoing previous run if the job is re-triggered
concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  publish:
    name: Publish web build to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history of commits and tags so that git describe --tags works
          fetch-depth: 0

      - uses: ./.github/actions/lfs-cached-checkout

      - name: Export web build
        uses: endlessm/godot-export-action@v3
        with:
          godot_version: ${{ env.GODOT_VERSION }}
          export_preset: "Web"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
